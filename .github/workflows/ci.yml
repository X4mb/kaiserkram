# Validate every push / PR: strict typecheck, i18n keys, a smoke test of the bundle
# against stubbed Foundry globals, and zip assembly.
# This is the gate that makes Dependabot bumps safe to merge.
name: CI
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Check i18n keys
        run: npm run check:i18n

      - name: Smoke test (bundle loads, features register only when enabled)
        run: npm run smoke

      - name: Build + package release zip (verify it assembles)
        run: npm run release-pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-zip-${{ github.sha }}
          path: module.zip
          if-no-files-found: error
          retention-days: 7
